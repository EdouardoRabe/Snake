name: Java CI

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B -DskipTests=false package

      - name: Upload artifact (JAR)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: snake-jar
          path: target/*.jar

  create_release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifact from build
        uses: actions/download-artifact@v4
        with:
          name: snake-jar

      - name: Inspect downloaded files (debug)
        run: |
          echo "Listing files in workspace"
          ls -la
          echo "Listing downloaded artifact directory"
          ls -la snake-jar || true

      - name: Move JAR to workspace root
        run: |
          set -e
          if [ -d snake-jar ]; then
            mv snake-jar/*.jar . || true
          fi
          echo "Files in workspace after move:"
          ls -la

      - name: Create GitHub Release and upload JAR
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: '*.jar'
          token: ${{ secrets.GITHUB_TOKEN }}
          makeLatest: true

